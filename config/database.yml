default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "billetto_assignment_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "billetto_assignment_test") %>

production:
  primary: &primary_production
    <<: *default
    database: billetto_assignment_production
    username: billetto_assignment
    password: <%= ENV["BILLETTO_ASSIGNMENT_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: billetto_assignment_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: billetto_assignment_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: billetto_assignment_production_cable
    migrations_paths: db/cable_migrate
